name: Build & Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag / version, e.g. v1.1.0'
        required: true
        type: string
      google_server_client_id:
        description: 'Firebase Google Web OAuth client ID. Empty uses repository variable LEVEL_UP_GOOGLE_SERVER_CLIENT_ID.'
        required: false
        type: string

permissions:
  contents: write
  actions: read

# Match the toolchain verified for Level Up. The retained upstream F-Droid
# recipe describes its historical build and is not a cloud release recipe.
env:
  FLUTTER_VERSION: '3.47.7'
  SIGNPATH_ORGANIZATION_ID: '56d04f3f-a39d-43ed-9e68-fb90ca3852d6'
  SIGNPATH_PROJECT: 'streak'

jobs:
  build:
    name: Build split APKs
    runs-on: ubuntu-latest
    # Only as a pull request check. A tagged run goes straight to release, which
    # builds and signs on its own, so nothing is compiled twice.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node for upload safety
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Check repository upload safety
        run: node scripts/check-upload-safety.mjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Pull-request artifacts are local-mode checks, not production releases.
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     Streak-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   Streak-armeabi-v7a.apk
          mv app-x86_64-release.apk        Streak-x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: level-up-local-check-apks
          path: build/app/outputs/flutter-apk/Streak-*.apk
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    # Only when manually dispatched with a tag. The notes are generated from the
    # merged pull requests, and the rest is filled in by hand after publishing.
    if: github.event_name == 'workflow_dispatch'

    # Retain the existing fixed cache path and deterministic compiler options.
    # Cloud-configured APKs are not the historical upstream F-Droid artifact.
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      LEVEL_UP_GOOGLE_SERVER_CLIENT_ID: ${{ inputs.google_server_client_id || vars.LEVEL_UP_GOOGLE_SERVER_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node for production preflight
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Validate Firebase Google configuration and release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e 'if (!/^v?[0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9.-]+)?$/.test(process.env.RELEASE_TAG || "")) { console.error("Use a version tag such as v3.0.0."); process.exit(1); }'
          node -e 'const value = process.env.LEVEL_UP_GOOGLE_SERVER_CLIENT_ID || ""; if (value && !/^[A-Za-z0-9][A-Za-z0-9._-]*\.apps\.googleusercontent\.com$/.test(value)) { console.error("Configure a Web OAuth client ID ending in .apps.googleusercontent.com."); process.exit(1); }'

      - name: Check repository upload safety
        run: node scripts/check-upload-safety.mjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Reproducibility: the jni package bakes a unique build-id into libdartjni.so.
      # Force --build-id=none so the native lib is deterministic. F-Droid applies
      # this exact same patch in its recipe.
      - name: Patch jni build-id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt

      # Use the owner's existing release key stored in GitHub Secrets.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          node scripts/configure_android_signing.mjs

      # Version name and code continue to come entirely from pubspec.yaml.
      # --split-debug-info moves the path-laden debug symbols out of libapp.so so it
      # builds deterministically. F-Droid uses the same flag.
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols --dart-define=LEVEL_UP_GOOGLE_SERVER_CLIENT_ID="$LEVEL_UP_GOOGLE_SERVER_CLIENT_ID"

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     Streak-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   Streak-armeabi-v7a.apk
          mv app-x86_64-release.apk        Streak-x86_64.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/Streak-arm64-v8a.apk
            build/app/outputs/flutter-apk/Streak-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Streak-x86_64.apk

  windows:
    name: Build Windows
    runs-on: windows-latest
    # Runs after the release exists and only adds the zip to it. Kept separate on
    # purpose: if the Windows build ever breaks, the APKs are already published.
    needs: release
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # Everything the app needs to run: Streak.exe, the plugin DLLs, the MSVC
      # runtime and data/. Unzip anywhere and double click.
      - name: Zip the build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Streak-windows-x64.zip

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Build the installer
        run: |
          $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe").FullName
          & $iscc "/DAppVersion=$('${{ inputs.tag }}'.TrimStart('v'))" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add it to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            Streak-windows-x64.zip
            build/installer/Streak-windows-x64-setup.exe

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 30
    needs: release
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Install build dependencies
        run: apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y curl git jq unzip xz-utils zip file ca-certificates desktop-file-utils clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev lld

      - name: Let git trust the container directories
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package
        run: bash linux/package.sh

      - name: Add them to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            Streak-linux-x64.tar.gz
            Streak-x86_64.AppImage
